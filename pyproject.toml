[project]
name = "personal-research-assistant"
version = "0.3.0"
description = "Research Desk: local deep research with Ollama. Collects web pages and papers into a private hybrid-search library and writes reports where every sentence cites a source passage. Started from langchain-ai/local-deep-researcher."
authors = [
    { name = "Lance Martin" },
    { name = "Prashanth" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.1.0",
    "langchain>=1.1.0",
    "langchain-community>=0.4.0",
    "tavily-python>=0.7.23",
    "langchain-ollama>=1.0.0",
    "ddgs>=9.0.0",
    "langchain-openai>=1.1.14",
    "openai>=2.31.0",
    "httpx>=0.28.1",
    "markdownify>=0.11.0",
    "python-dotenv==1.2.3",
    "psutil>=5.9",                 # free-memory check in the doctor and dashboard
    "python-frontmatter>=1.1.0",
    "pypdf>=5.0.0",
    "numpy>=1.26",
    "trafilatura>=2.0",
    "langchain-text-splitters>=0.3.0",
    "win11toast>=0.35; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff>=0.15.10", "pytest>=8.0", "langgraph-cli[inmem]>=0.4", "openpyxl>=3.1"]  # openpyxl: eval labelling workbooks
# PDF/DOCX/HTML -> markdown with tables (heavy: pulls PyTorch). Without it PDFs fall back to pypdf text.
docling = ["docling>=2.0"]
# Cross-encoder reranker (RERANK=true, the default): runs bge-reranker-v2-m3 on the CPU. Also pulled in by docling.
rerank = ["torch>=2.2", "transformers>=4.40"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_assistant"]

[tool.setuptools.package-dir]
"research_assistant" = "src/research_assistant"

[tool.setuptools.package-data]
"*" = ["py.typed", "*.sql"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "E501",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "pytest>=8.0",
]
