name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: Research Desk adds a stage only when it shows its effect (a test, a measurement, or feedback).
