# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Versions are pinned to what Research Desk was developed and tested with (uv.lock, dashboard/package-lock.json,
# docs/SETUP.md "Tested versions"). Routine version-update PRs are off (limit 0); upgrades are done deliberately and
# re-tested. GitHub security alerts are separate and still arrive.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Majors that need a deliberate upgrade (Next 16 + eslint-config-next support, the native TS compiler,
      # and @types/node must follow the Node version CI runs: 22).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
