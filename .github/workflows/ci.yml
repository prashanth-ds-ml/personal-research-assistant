name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/ scripts/
      - name: Offline tests (fake embeddings + fake LLM - no Ollama, no network, no Docling)
        run: pytest tests -q
      - name: Both graphs compile (import-time only; no Ollama or vault needed)
        run: |
          python -c "from research_assistant.graph import graph; print(list(graph.get_graph().nodes))"
          python -c "from research_assistant.goal_graph import graph; print(list(graph.get_graph().nodes))"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  dashboard:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
