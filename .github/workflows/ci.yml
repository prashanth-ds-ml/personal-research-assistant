name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/
      - name: Offline tests (fake embeddings + fake LLM - no Ollama, no network, no Docling, no reranker model)
        run: uv run pytest tests -q
      - name: Both graphs compile (import-time only; no Ollama or vault needed)
        run: |
          uv run python -c "from research_assistant.graph import graph; print(list(graph.get_graph().nodes))"
          uv run python -c "from research_assistant.goal_graph import graph; print(list(graph.get_graph().nodes))"

  dashboard:
    name: Dashboard (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      - run: npm run build
