# One command: docker compose up --build
#   dashboard -> http://localhost:3001
#   backend   -> http://localhost:2025 (LangGraph API, /docs for Swagger)
#
# Ollama runs on the HOST (models are large, GPU access is simpler there);
# containers reach it via host.docker.internal. Pull first:
#   ollama pull llama3.1:8b && ollama pull qwen3-embedding:0.6b
#
# Deliberately no `env_file: .env`: the host .env holds Windows paths and
# secrets that don't belong in containers. Beware that compose ALSO reads
# ./.env for ${...} interpolation, so only DOCKER_*/VAULT_DIR/DOCS_DIR/
# DASHBOARD_PORT/DOCKER_* are interpolated here - never a name the app itself uses
# (OLLAMA_BASE_URL, LOCAL_LLM, ...), or the host .env would leak in.
services:
  backend:
    build: .
    ports:
      - "127.0.0.1:2025:2025"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LOCAL_LLM: ${DOCKER_LOCAL_LLM:-llama3.1:8b}
      # Per-role models for the deep_research graph; blank means "use LOCAL_LLM".
      PLANNER_MODEL: ${DOCKER_PLANNER_MODEL:-}
      EXTRACTOR_MODEL: ${DOCKER_EXTRACTOR_MODEL:-}
      WRITER_MODEL: ${DOCKER_WRITER_MODEL:-gemma4:e4b}
      EMBEDDING_MODEL: ollama:qwen3-embedding:0.6b
      VAULT_PATH: /vault
      DOCS_PATH: /docs
      # Deep research indexes these (';'-separated). /docs is the read-only folder mounted below.
      LIBRARY_FOLDERS: ${DOCKER_LIBRARY_FOLDERS:-/vault/Sources;/vault/Library;/docs}
      CONTACT_EMAIL: ${DOCKER_CONTACT_EMAIL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Docker Desktop
    volumes:
      - ${VAULT_DIR:-./vault}:/vault           # notes, sources, reports, profile (read/write)
      - ${DOCS_DIR:-./sample_docs}:/docs:ro    # internal documents to search (read-only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2025/ok', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3001}:3001"
    environment:
      LANGGRAPH_API_URL: http://backend:2025
      VAULT_PATH: /vault
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: qwen3-embedding:0.6b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VAULT_DIR:-./vault}:/vault
    depends_on:
      backend:
        condition: service_healthy
